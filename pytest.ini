[pytest]
# Минимальная версия pytest
minversion = 7.0

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    
# Маркеры для категоризации тестов
markers =
    positive: Positive test scenarios
    negative: Negative test scenarios
    edge: Edge and boundary test cases
    smoke: Smoke tests
    regression: Regression tests
    jsonplaceholder: Tests for JSONPlaceholder API
    reqres: Tests for ReqRes API
    dummyapi: Tests for DummyAPI

# Директории для поиска тестов
testpaths = tests

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = reports/test_logs.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)s] - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
